# All ports are bound to 127.0.0.1: the app has no login, so it must not be
# reachable from other machines on your network. Change this only behind auth.
services:
  backend:
    build:
      context: ./backend
      args:
        # Set to "true" to include TensorFlow for in-app Deep Learning training
        # (adds a few GB to the image).
        INSTALL_DL: "false"
    container_name: aies-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    # Data (including the SQLite database) lives in ./backend/storage on the host.
    volumes:
      - ./backend/storage:/app/storage
    networks:
      - aies

  frontend:
    build: ./frontend
    container_name: aies-frontend
    # nginx serves the app and forwards /api to the backend (see frontend/nginx.conf).
    ports:
      - "127.0.0.1:5180:5180"
    depends_on:
      - backend
    networks:
      - aies

  # Optional: Ollama for local LLM/embeddings. Start with `--profile ollama`
  # and set OLLAMA_BASE_URL=http://ollama:11434 in .env so the backend finds it.
  ollama:
    image: ollama/ollama:latest
    container_name: aies-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aies
    profiles: ["ollama"]

volumes:
  ollama_data:

networks:
  aies:
    driver: bridge

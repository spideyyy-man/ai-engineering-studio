name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker (compose build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5180/api/v1/projects > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5180/ | grep -q '<div id="root">'
          curl -fsS -X POST http://127.0.0.1:5180/api/v1/projects \
            -H 'Content-Type: application/json' -d '{"name":"smoke"}' | grep -q '"name":"smoke"'
          curl -fsS http://127.0.0.1:8000/healthz
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

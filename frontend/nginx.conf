# Used by frontend/Dockerfile. Serves the built app on :5180 and proxies the
# API to the "backend" service from docker-compose.yml.
server {
    listen 5180;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the backend's MAX_UPLOAD_MB default.
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Training requests can run for several minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
